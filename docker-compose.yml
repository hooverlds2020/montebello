services:
  montebello-db:
    image: postgres:16
    container_name: montebello-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: montebello_diagnostico
      POSTGRES_USER: montebello
      # POSTGRES_PASSWORD viene de .env (ver .env.example)
    volumes:
      - montebello_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/1_init.sql
      - ./db/seed_preguntas.sql:/docker-entrypoint-initdb.d/2_seed.sql
    ports:
      - "127.0.0.1:5434:5432"

  montebello-app:
    build: ./app
    container_name: montebello-app
    restart: unless-stopped
    depends_on:
      - montebello-db
    env_file:
      - .env
    environment:
      PGHOST: montebello-db
      PGPORT: 5432
      PGDATABASE: montebello_diagnostico
      PGUSER: montebello
      # PGPASSWORD, ADMIN_PASSWORD, ADMIN_JWT_SECRET, ALUMNO_JWT_SECRET,
      # SITE_URL y las variables SMTP_* vienen todas de .env (ver .env.example)
    volumes:
      - ./uploads:/app/public/uploads
    expose:
      - "3000"
    networks:
      - default
      - proxy-network

volumes:
  montebello_db_data:

networks:
  proxy-network:
    external: true
